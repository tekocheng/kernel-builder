name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target device"
        type: choice
        default: marble
        options:
          - marble
      kernel_source:
        description: "Kernel source / ROM base"
        type: choice
        default: aospa
        options:
          - aospa
          - lineage
          - infinityx
          - shinkai
          - lunaris
          - melt
          - bouquet
      build_kernelsu:
        description: "Official KernelSU (tiann)"
        type: boolean
        default: true
      build_kernelsu_next:
        description: "KernelSU-Next"
        type: boolean
        default: false
      build_sukisu_nova:
        description: "SukiSU Nova"
        type: boolean
        default: false
      build_bakasu:
        description: "BakaSU"
        type: boolean
        default: false
      enable_susfs:
        description: "Enable SUSFS"
        type: boolean
        default: true
      susfs_branch:
        description: "SUSFS branch. Empty uses the default (gki-android12-5.10)."
        type: string
        default: ""
      susfs_ref:
        description: "SUSFS commit or tag to pin. Empty uses the tip of the branch."
        type: string
        default: ""
      enable_nomount:
        description: "Include NoMount in kernel image"
        type: boolean
        default: false
      nomount_ref:
        description: "NoMount branch, tag, or commit. Empty uses the default (dev)."
        type: string
        default: ""
      toolchain:
        description: "Compiler toolchain"
        type: choice
        default: auto
        options:
          - auto
          - android-r596125
          - llvm-23.1.6
          - llvm-slim-23.1.6
          - alchemist-llvm-23
      lto:
        description: "Link-time optimization"
        type: choice
        default: thin
        options:
          - thin
          - none
          - full
      build_scope:
        description: "Output/package mode"
        type: choice
        default: image-menu
        options:
          - image-only
          - full
          - image-menu
      draft_release:
        description: "Create a draft GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (simple options)
    uses: ./.github/workflows/build-advanced.yml
    secrets: inherit
    with:
      device: ${{ inputs.device }}
      kernel_name: ""
      kernel_source: ${{ inputs.kernel_source }}
      all_sources: false
      source_ref: ""
      build_kernelsu: ${{ inputs.build_kernelsu }}
      build_kernelsu_next: ${{ inputs.build_kernelsu_next }}
      build_sukisu_nova: ${{ inputs.build_sukisu_nova }}
      build_bakasu: ${{ inputs.build_bakasu }}
      manager_ref: ""
      enable_susfs: ${{ inputs.enable_susfs }}
      susfs_branch: ${{ inputs.susfs_branch }}
      susfs_ref: ${{ inputs.susfs_ref }}
      enable_nomount: ${{ inputs.enable_nomount }}
      nomount_ref: ${{ inputs.nomount_ref }}
      toolchain: ${{ inputs.toolchain }}
      lto: ${{ inputs.lto }}
      build_scope: ${{ inputs.build_scope }}
      ccache: true
      uname_hash: true
      uname_run_id: auto
      draft_release: ${{ inputs.draft_release }}
